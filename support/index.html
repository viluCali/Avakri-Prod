    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
        .page-title { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
        .frame-layout { display: flex; gap: 32px; border: 1px solid #111; min-height: 540px; background: #fff; }
        .tabs-sidebar { width: 280px; border-right: 1px solid #111; background: #fafafa; display: flex; flex-direction: column; }
        .tab-btn { text-align: left; padding: 18px 20px; border: none; background: transparent; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eaeaea; cursor: pointer; color: #555; transition: all 0.2s; }
        .tab-btn:hover { background: #f0f0f0; color: #000; }
        .tab-btn.active { background: #111; color: #fff; }
        .tab-content-area { flex: 1; padding: 36px 40px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .pane-title { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        .pane-desc { font-size: 13px; color: #666; margin-bottom: 24px; line-height: 1.5; }
        .mock-box { border: 2px dashed #999; padding: 36px 20px; text-align: center; background: #fafafa; max-width: 500px; margin-top: 12px; font-size: 14px; color: #555; }
        .card { background: #ffffff; border: 1px solid #111111; padding: 28px; margin-bottom: 24px; }
        .card-title { font-size: 15px; font-weight: 800; text-transform: uppercase; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }
        .status-badge { font-size: 11px; font-weight: 700; background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 12px; }
        .info-item { border-left: 2px solid #111111; padding-left: 14px; }
        .info-label { font-size: 11px; text-transform: uppercase; color: #666666; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .info-val { font-size: 15px; font-weight: 600; color: #111111; }
        .empty-matches { text-align: center; padding: 40px 24px; border: 1px dashed #cccccc; background: #fafafa; margin-top: 8px; }
        .empty-matches p { font-size: 15px; color: #333333; margin-bottom: 8px; font-weight: 700; }
        .empty-matches span { font-size: 13px; color: #666666; }
        @media (max-width: 768px) {
            .container { padding: 0 10px; margin: 16px auto; }
            .frame-layout { flex-direction: column; min-height: auto; }
            .tabs-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #111; flex-direction: row; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
            .tab-btn { flex: 0 0 auto; padding: 12px 14px; font-size: 11px; border-bottom: none; border-right: 1px solid #eaeaea; }
            .tab-content-area { padding: 20px 14px; }
        }
        body:not(.ready) .container { visibility: hidden; }
    </style>
